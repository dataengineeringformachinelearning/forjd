    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('suite-theme') || localStorage.getItem('theme');
          if (pref !== 'light' && pref !== 'dark' && pref !== 'system') {
            pref = 'system';
          }
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = pref === 'system' ? (dark ? 'dark' : 'light') : pref;
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          root.classList.toggle('dark', theme === 'dark');
          root.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>

    <!-- Critical Inter roman — skip preload on Save-Data / reduced-data (CSS still loads swap). -->
    <script>
      (function () {
        try {
          var saveData = navigator.connection && navigator.connection.saveData;
          var reduced =

          if (saveData || reduced) return;
          var link = document.createElement('link');
          link.rel = 'preload';
          link.href = '/fonts/inter/InterVariable.woff2';
          link.as = 'font';
          link.type = 'font/woff2';
          link.crossOrigin = 'anonymous';
          document.head.appendChild(link);
        } catch (e) {}
      })();
    </script>

    <!-- Analytics: interaction-first; skip Save-Data / reduced-data; no idle auto-load. -->
    <script>
      (() => {
        let loaded = false;
        const constrained = () => {
          try {
            if (navigator.connection && navigator.connection.saveData) return true;
            return window.matchMedia && window.matchMedia('(prefers-reduced-data: reduce)').matches;
          } catch (e) {
            return false;
          }
        };
        const loadAnalytics = () => {
          if (loaded || constrained()) return;
          loaded = true;

          window.dataLayer = window.dataLayer || [];
          window.gtag = (...args) => window.dataLayer.push(args);

          const googleTag = document.createElement('script');
          googleTag.async = true;
          googleTag.src = 'https://www.googletagmanager.com/gtag/js?id=G-XM161XLZN9';
          document.head.appendChild(googleTag);
          window.gtag('js', new Date());
          window.gtag('config', 'G-XM161XLZN9', {
            cookie_flags: 'SameSite=None;Secure;Partitioned',
          });

          window.clarity =
            window.clarity ||
            ((...args) => {
              window.clarity.q = window.clarity.q || [];
              window.clarity.q.push(args);
            });
          const clarityTag = document.createElement('script');
          clarityTag.async = true;
          clarityTag.src = 'https://www.clarity.ms/tag/xddv4klojn';
          document.head.appendChild(clarityTag);
        };

        for (const event of ['pointerdown', 'keydown']) {
          window.addEventListener(event, loadAnalytics, { once: true, passive: true });
        }
      })();
    </script>
