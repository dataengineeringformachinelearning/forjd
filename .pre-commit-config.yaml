# FORJD quality gates — format + lint on commit; commit-msg convention.
# Install: npm run install-hooks
# Run all:  npm run quality  ·  uvx pre-commit run --all-files
# Guide: docs/GIT.md
exclude: '^(?:backend/\.venv|engine/target|backend/static/vendor)/'

default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files
        args: [--maxkb=1600]
        exclude: ^backend/static/vendor/
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: forjd-config-catalog
        name: Config catalog drift
        entry: uv run --no-sync --project backend python scripts/check_config_catalog.py
        language: system
        files: ^(config/|backend/app/core/config\.py|backend/\.env\.example|engine/\.env\.example)
        pass_filenames: false

      - id: forjd-validate-workflows
        name: Validate workflow YAML
        entry: uv run --no-sync --project backend python scripts/validate_workflows.py --include-examples
        language: system
        files: ^(backend/workflows/|backend/app/workflows/)
        pass_filenames: false

      - id: forjd-engine-fmt
        name: cargo fmt (engine)
        entry: bash -c 'cd engine && cargo fmt --all -- --check'
        language: system
        files: ^engine/.*\.rs$
        pass_filenames: false

      - id: forjd-commit-msg
        name: Commit message convention
        entry: python3 scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
