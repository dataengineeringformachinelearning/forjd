# FORJD quality gates — format + lint on commit; commit-msg convention.
# Install: npm run install-hooks
# Run all:  npm run quality  ·  uvx pre-commit run --all-files
# Guide: docs/GIT.md
exclude: '^(?:backend/\.venv|frontend/node_modules|frontend/dist|frontend/\.angular|engine/target|backend/static/vendor)/'

default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files
        args: [--maxkb=1600]
        exclude: ^backend/static/vendor/
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^frontend/.*\.(ts|html|scss|css|mjs|json|md)$
        exclude: ^(frontend/libs/forjd-ui/src/lib/styles/(suite-.*\.css|SUITE_.*\.md|suite-role-a\.json)|frontend/package-lock\.json)
        additional_dependencies:
          - prettier@3.9.6

  - repo: local
    hooks:
      - id: forjd-typecheck
        name: TypeScript check (frontend + forjd-ui)
        entry: npm run typecheck --prefix frontend
        language: system
        files: ^frontend/.*\.(ts|html)$
        pass_filenames: false

      - id: forjd-config-catalog
        name: Config catalog drift
        entry: uv run --no-sync --project backend python scripts/check_config_catalog.py
        language: system
        files: ^(config/|backend/app/core/config\.py|backend/\.env\.example|engine/\.env\.example|frontend/src/environments/)
        pass_filenames: false

      - id: forjd-validate-workflows
        name: Validate workflow YAML
        entry: uv run --no-sync --project backend python scripts/validate_workflows.py --include-examples
        language: system
        files: ^(backend/workflows/|backend/app/workflows/)
        pass_filenames: false

      - id: forjd-suite-purity
        name: Suite purity (forjd-ui ↔ backend/static)
        entry: npm run suite:purity --prefix frontend
        language: system
        files: ^(frontend/libs/forjd-ui/src/lib/styles/|backend/static/)suite-
        pass_filenames: false

      - id: forjd-engine-fmt
        name: cargo fmt (engine)
        entry: bash -c 'cd engine && cargo fmt --all -- --check'
        language: system
        files: ^engine/.*\.rs$
        pass_filenames: false

      - id: forjd-commit-msg
        name: Commit message convention
        entry: python3 scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
