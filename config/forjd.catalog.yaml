# FORJD configuration catalog — single inventory source of truth.
#
# Runtime typed consumers (do not duplicate defaults here as authority):
#   backend → app.core.config.Settings
#   engine  → data_plane::config::Config + process binary env
#
# This file owns: names, layers, secrecy, feature-flag roles, and example paths.
# Enforce with: python scripts/check_config_catalog.py
# Human guide: docs/CONFIGURATION.md
# ADR: docs/adr/0004-config-catalog-inventory-sot.md

version: 1

# --- Feature flags (config-gated behaviour; empty/false = off) ---
feature_flags:
  - name: FORJD_ADDONS
    layer: backend
    summary: Comma-separated add-on slugs or "all"; empty disables all add-ons
    inspect: GET /api/v1/addons
    docs: backend/docs/ADDONS.md
  - name: FORJD_ADDONS_CONFIG
    layer: backend
    summary: YAML profile path used only when FORJD_ADDONS is empty
  - name: WORKFLOWS_STRICT
    layer: backend
    summary: Fail closed on unknown workflow processors/steps at registry load
    docs: docs/EXTENDING.md
  - name: RATE_LIMIT_ENABLED
    layer: backend
    summary: Sole rate limiter gate (app/core/rate_limit.py)
  - name: ENABLE_API_DOCS
    layer: backend
    summary: OpenAPI /docs /redoc; forced off in production unless explicitly set
  - name: SOFT_MIGRATE_SCHEMA
    layer: backend
    summary: Local-only soft table shapes; forced false in production
  - name: REQUIRE_RLS
    layer: backend
    summary: Fail ready/startup without RLS; forced true in production
  - name: REQUIRE_CRYPTO_SESSION
    layer: backend
    summary: Require active crypto session for envelopes; forced true in production
  - name: SUPABASE_AUTH_REQUIRED
    layer: backend
    summary: Fail closed when auth config missing on protected routes
  - name: FORJD_ROLE
    layer: engine
    summary: Data-plane role (engine|all|relay|scheduler|probe|normalizer|ingest|cpe)
  - name: ANALYTICS_ROLLUP_INTERVAL_SECONDS
    layer: backend
    summary: "0 disables analytics-rollup worker"
    kind: worker_gate
  - name: TRAINING_TICK_SECONDS
    layer: backend
    summary: "0 disables ml-training worker"
    kind: worker_gate
  - name: RETENTION_SWEEP_INTERVAL_SECONDS
    layer: backend
    summary: "0 disables retention worker"
    kind: worker_gate
  - name: PROJECTION_TICK_SECONDS
    layer: backend
    summary: "0 disables background projection catch-up"
    kind: worker_gate

# --- Environment / settings inventory ---
# Fields:
#   name       — env var / Settings field (UPPER_SNAKE)
#   layers     — backend | engine | frontend | tooling | infra
#   secret     — true if values must never be committed / returned by API
#   settings   — true if must exist on backend Settings (backend layer)
#   example    — relative path that should document the key (optional)
#   group      — scannable category
#   summary    — one line

variables:
  # App
  - { name: PROJECT_NAME, layers: [backend], secret: false, settings: true, example: backend/.env.example, group: app }
  - { name: PROJECT_VERSION, layers: [backend], secret: false, settings: true, example: backend/.env.example, group: app }
  - { name: API_V1_STR, layers: [backend], secret: false, settings: true, group: app, summary: Not typically set via .env }
  - { name: ENVIRONMENT, layers: [backend, engine], secret: false, settings: true, example: backend/.env.example, group: app, summary: production|prod|staging|stage|development }
  - { name: DEBUG, layers: [backend], secret: false, settings: true, example: backend/.env.example, group: app }
  - { name: HOST, layers: [backend], secret: false, settings: true, example: backend/.env.example, group: app }
  - { name: PORT, layers: [backend, engine], secret: false, settings: true, example: backend/.env.example, group: app }
  - { name: ENABLE_API_DOCS, layers: [backend], secret: false, settings: true, example: backend/.env.example, group: app, flag: true }
  - { name: CORS_ORIGINS, layers: [backend], secret: false, settings: true, example: backend/.env.example, group: app }

  # Auth / edge
  - { name: API_KEY, layers: [backend], secret: true, settings: true, example: backend/.env.example, group: auth }
  - { name: FORJD_PROVISION_TOKEN, layers: [backend], secret: true, settings: true, example: backend/.env.example, group: auth }
  - { name: SUPABASE_URL, layers: [backend], secret: false, settings: true, example: backend/.env.example, group: auth }
  - { name: SUPABASE_JWT_SECRET, layers: [backend], secret: true, settings: true, example: backend/.env.example, group: auth }
  - { name: SUPABASE_JWT_AUDIENCE, layers: [backend], secret: false, settings: true, example: backend/.env.example, group: auth }
  - { name: SUPABASE_AUTH_REQUIRED, layers: [backend], secret: false, settings: true, example: backend/.env.example, group: auth, flag: true }

  # Data stores
  - { name: POSTGRES_DSN, layers: [backend, engine], secret: true, settings: true, example: backend/.env.example, group: datastore }
  - { name: DATABASE_URL, layers: [engine], secret: true, settings: false, example: engine/.env.example, group: datastore, summary: Engine alias for Postgres (or POSTGRES_DSN) }
  - { name: REDIS_URL, layers: [backend, engine], secret: true, settings: true, example: backend/.env.example, group: datastore }
  - { name: PREFECT_API_URL, layers: [backend], secret: false, settings: true, example: backend/.env.example, group: datastore }
  - { name: DB_POOL_MIN, layers: [backend], secret: false, settings: true, example: backend/.env.example, group: datastore }
  - { name: DB_POOL_MAX, layers: [backend], secret: false, settings: true, example: backend/.env.example, group: datastore }

  # Engine bridge (API → Rust)
  - { name: ENGINE_URL, layers: [backend], secret: false, settings: true, example: backend/.env.example, group: engine }
  - { name: ENGINE_API_TOKEN, layers: [backend, engine], secret: true, settings: true, example: backend/.env.example, group: engine }
  - { name: ENGINE_TIMEOUT_SECONDS, layers: [backend], secret: false, settings: true, example: backend/.env.example, group: engine }

  # Engine / data plane
  - { name: FORJD_ROLE, layers: [engine], secret: false, settings: false, example: engine/.env.example, group: engine, flag: true }
  - { name: RUST_LOG, layers: [engine], secret: false, settings: false, example: engine/.env.example, group: engine }
  - { name: FORJD_ENV, layers: [engine], secret: false, settings: false, example: engine/.env.example, group: engine, summary: Engine production gate (distinct from backend ENVIRONMENT) }
  - { name: FORJD_TRANSPORT_SECURITY, layers: [engine], secret: false, settings: false, example: engine/.env.example, group: engine }
  - { name: FORJD_INTERNODE_ENCRYPTION, layers: [engine], secret: false, settings: false, example: engine/.env.example, group: engine }
  - { name: FORJD_INTERNODE_ACTIVE_KID, layers: [engine], secret: false, settings: false, example: engine/.env.example, group: engine }
  - { name: FORJD_INTERNODE_KEYS, layers: [engine], secret: true, settings: false, example: engine/.env.example, group: engine }
  - { name: FORJD_NODE_ID, layers: [engine], secret: false, settings: false, group: engine }
  - { name: MAX_CONCURRENCY, layers: [engine], secret: false, settings: false, group: engine }
  - { name: BATCH_SIZE, layers: [engine], secret: false, settings: false, group: engine }
  - { name: POLL_INTERVAL_SECS, layers: [engine], secret: false, settings: false, group: engine }
  - { name: MAX_ATTEMPTS, layers: [engine], secret: false, settings: false, group: engine }
  - { name: PINGER_INTERVAL_SECS, layers: [engine], secret: false, settings: false, group: engine }
  - { name: STRUCTURED_LOGS, layers: [engine], secret: false, settings: false, group: engine }
