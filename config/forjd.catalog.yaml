  - { name: WORKFLOWS_STRICT, layers: [backend], secret: false, settings: true, example: backend/.env.example, group: workflows, flag: true }
  - { name: SOFT_MIGRATE_SCHEMA, layers: [backend], secret: false, settings: true, example: backend/.env.example, group: zero_trust, flag: true }
  - { name: REQUIRE_RLS, layers: [backend], secret: false, settings: true, example: backend/.env.example, group: zero_trust, flag: true }
